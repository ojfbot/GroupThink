<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GroupThink Settings</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--gt-font-sans);
      background: var(--gt-bg);
      color: var(--gt-text-primary);
      -webkit-font-smoothing: antialiased;
      padding: 48px;
      max-width: 560px;
      margin: 0 auto;
    }
    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--gt-text-muted);
      margin-bottom: 40px;
    }
    .field {
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gt-text-secondary);
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      font-family: var(--gt-font-sans);
      font-size: 14px;
      color: var(--gt-text-primary);
      background: var(--gt-surface-1);
      border: 1px solid var(--gt-border);
      border-radius: 6px;
      outline: none;
      transition: border-color 120ms;
    }
    input:focus, select:focus {
      border-color: var(--gt-accent);
    }
    .hint {
      font-size: 12px;
      color: var(--gt-text-muted);
      margin-top: 4px;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }
    button {
      padding: 10px 20px;
      font-family: var(--gt-font-sans);
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 150ms;
    }
    .btn-primary {
      background: var(--gt-accent);
      color: white;
    }
    .btn-primary:hover { background: var(--gt-accent-hover); }
    .btn-ghost {
      background: transparent;
      color: var(--gt-text-secondary);
    }
    .btn-ghost:hover { background: var(--gt-surface-hover); }
    .saved {
      font-size: 13px;
      color: var(--gt-success);
      font-weight: 500;
      opacity: 0;
      transition: opacity 200ms;
    }
    .saved.visible { opacity: 1; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
